<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffeehouse</title>
  <link rel="stylesheet" href="/css/tea-room.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/tea-room">
      <span class="brand-mark">
        <img class="brand-logo" src="/images/coffeehouse-logo.svg" alt="Coffeehouse logo">
      </span>
      <span class="brand-title">
        <strong>Coffeehouse</strong>
        <span>News summaries brewed with context and conclusions</span>
      </span>
    </a>
  </header>

  <main class="page">
    <section class="chat-panel">
      <div class="chat-header">
        <div>
          <h1>Recent news</h1>
          <p>Read generated summaries, background context, explanations, and conclusions.</p>
        </div>
      </div>

      <div class="empty-state" th:if="${#lists.isEmpty(posts)}">
        <p>No briefs yet. New topics are generated from the configured news source.</p>
      </div>

      <div class="thread-list" th:if="${!#lists.isEmpty(posts)}">
        <a class="thread-card" th:each="p : ${posts}" th:href="@{'/tea-room/' + ${p.id}}">
          <div class="thread-meta">
            <strong th:text="${p.authorName}">Guest</strong>
            <span>published a brief</span>
          </div>
          <p th:text="${p.content}">Post preview</p>
          <span class="source-pill" th:if="${p.sourceUrl != null}">News source available</span>
        </a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
