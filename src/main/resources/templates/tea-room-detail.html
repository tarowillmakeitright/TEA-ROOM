<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffeehouse Brief</title>
  <link rel="stylesheet" href="/css/tea-room.css">
  <script defer src="/js/article-actions.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/tea-room">
      <span class="brand-mark">
        <img class="brand-logo" src="/images/coffeehouse-logo.svg" alt="Coffeehouse logo">
      </span>
      <span class="brand-title">
        <strong>Coffeehouse</strong>
        <span>Freshly brewed news brief</span>
      </span>
    </a>
    <a class="button secondary" href="/tea-room">All briefs</a>
  </header>

  <main class="page">
    <section class="chat-panel">
      <div class="chat-header">
        <div>
          <h1>News brief</h1>
          <p>Sections refresh while the summary, knowledge, explanation, and conclusion are prepared.</p>
        </div>
      </div>

      <div class="messages">
        <article class="message-row user"
                 th:data-article-id="${post.id}"
                 th:data-article-title="${post.content}">
          <div class="bubble">
            <div class="detail-thumbnail"
                 th:if="${post.imageUrl != null}"
                 th:style="'background-image: url(' + ${post.imageUrl} + ')'"></div>
            <div class="detail-thumbnail fallback" th:if="${post.imageUrl == null}">
              <span>Coffeehouse</span>
            </div>
            <div class="message-meta">
              <strong th:text="${post.authorName}">Guest</strong>
              <span>source topic</span>
            </div>
            <p th:text="${post.content}">content</p>
            <a class="source-link"
               th:if="${post.sourceUrl != null}"
               th:href="${post.sourceUrl}"
               target="_blank"
               rel="noopener noreferrer">Open news source</a>
            <div class="article-actions detail-actions" aria-label="Article actions">
              <button class="action-button light" type="button" data-action="favorite" aria-pressed="false" title="Save">
                <span aria-hidden="true">*</span>
                <span class="action-label">Save</span>
              </button>
              <button class="action-button light" type="button"
                      data-action="share"
                      th:data-share-title="${post.content}"
                      th:data-share-url="@{'/tea-room/' + ${post.id}}"
                      th:data-source-url="${post.sourceUrl}"
                      title="Share">
                <span aria-hidden="true">&gt;</span>
                <span class="action-label">Share</span>
              </button>
            </div>
          </div>
        </article>

        <div id="replies"
             th:attr="hx-get=@{'/tea-room/' + ${post.id} + '/replies'}"
             hx-trigger="load, every 4s"
             hx-swap="innerHTML">
          <div th:replace="~{fragments/tea-room-replies :: replyList}"></div>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
