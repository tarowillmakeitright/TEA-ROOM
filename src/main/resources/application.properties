spring.config.import=optional:file:/home/dahmakeit/Documents/Programming/tea-room/.env[.properties]
server.port=8082
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tearoom}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# NewsAPI (English-only trend topics)
news.api.key=${NEWS_API_KEY:}
news.api.country=${NEWS_API_COUNTRY:us}
news.api.categories=${NEWS_API_CATEGORIES:science,technology,business}
news.reference.domains=${NEWS_REFERENCE_DOMAINS:reuters.com,apnews.com,bbc.com,npr.org,pbs.org,scientificamerican.com,nature.com,science.org,who.int,nih.gov,nasa.gov,smithsonianmag.com,nationalgeographic.com,livescience.com,space.com,theguardian.com}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-stacktrace=never
